name: Build (Windows)

# Builds the real Windows app, runs the tests and stores a ready-made, portable version
# (no installation, .NET included) as a download under "Actions -> Artifacts".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Tests (Core)
        run: dotnet test tests/MultiServerView.Core.Tests -c Release

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Publish app (win-x64, self-contained)
        run: >
          dotnet publish src/MultiServerView.App -c Release -r win-x64 --self-contained true
          -p:PublishReadyToRun=false -o publish

      - name: Ensure WebView2 runtime
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (Test-Path $key) { "WebView2 present: " + (Get-ItemProperty $key).pv }
          else {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile wv2.exe
            Start-Process .\wv2.exe -ArgumentList '/silent','/install' -Wait
          }

      # A real SSH server on the runner so terminal, SFTP, jump host and port forwarding are really tested.
      - name: Set up OpenSSH server for the self-test
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            $cap = Get-WindowsCapability -Online -Name 'OpenSSH.Server*' | Select-Object -First 1
            if ($cap.State -ne 'Installed') { Add-WindowsCapability -Online -Name $cap.Name | Out-Null }
            $pw = 'Smoke-Test-Pw-123!'
            New-LocalUser -Name msvtest -Password (ConvertTo-SecureString $pw -AsPlainText -Force) -PasswordNeverExpires | Out-Null
            # Without group membership the account lacks the right to sign in over the network (SSH)
            Add-LocalGroupMember -Group 'Users' -Member msvtest
            Start-Service sshd
            # The runner image restricts SSH via AllowGroups - add the group of the test user
            $cfg = 'C:\ProgramData\ssh\sshd_config'
            $lines = Get-Content $cfg
            ($lines | Where-Object { $_ -match '^\s*(AllowGroups|AllowUsers|DenyGroups|DenyUsers|PasswordAuthentication)' }) | ForEach-Object { "sshd_config: $_" }
            $lines = $lines | ForEach-Object { if ($_ -match '^\s*AllowGroups') { $_ + ' users' } else { $_ } }
            Set-Content $cfg $lines
            Restart-Service sshd
            "sshd: " + (Get-Service sshd).Status
            "MSV_SMOKE_SSH=127.0.0.1:22:msvtest:$pw" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          } catch { "OpenSSH server not available: $_" }

      # Really starts the finished app (window, WebView2, vault, DPAPI, RDP control), drives the interface
      # by script and stores screenshots + report.
      - name: App self-test on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          $out = (Resolve-Path smoke).Path
          $p = Start-Process -FilePath .\publish\MultiServerView.exe -ArgumentList '--smoke', $out -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Add-Content "$out\report.txt" "FAIL Timeout (the app did not exit)"; Get-Content "$out\report.txt"; if (Test-Path "$out\exit.log") { "--- Exit ---"; Get-Content "$out\exit.log" }; exit 1 }
          if (Test-Path "$out\report.txt") { Get-Content "$out\report.txt" } else { "No report produced" }
          if (Test-Path "$out\exit.log") { "--- Exit ---"; Get-Content "$out\exit.log" }
          exit $p.ExitCode

      # Also write the screenshots as text into the log (for evaluation without an artifact download)
      - name: Print screenshots as text
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem smoke\*.png -ErrorAction SilentlyContinue | ForEach-Object {
            "===PNG:$($_.Name)==="
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            for ($i = 0; $i -lt $b64.Length; $i += 3000) { "PNGDATA " + $b64.Substring($i, [Math]::Min(3000, $b64.Length - $i)) }
            "===ENDPNG==="
          }

      - name: OpenSSH diagnostics (on failure only)
        if: failure()
        shell: pwsh
        continue-on-error: true
        run: |
          Get-WinEvent -LogName 'OpenSSH/Operational' -MaxEvents 20 -ErrorAction SilentlyContinue | ForEach-Object { "$($_.TimeCreated) $($_.Message)" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Selftest-Screenshots
          path: |
            smoke/*.png
            smoke/report.txt
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MultiServerView-win-x64
          path: publish
          if-no-files-found: error
