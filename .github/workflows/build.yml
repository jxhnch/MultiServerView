name: Build (Windows)

# Baut die echte Windows-App, führt die Tests aus und legt eine fertige, portable Version
# (ohne Installation, .NET ist enthalten) als Download unter "Actions -> Artifacts" ab.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Tests (Core)
        run: dotnet test tests/MultiServerView.Core.Tests -c Release

      - name: UI bauen
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: App veröffentlichen (win-x64, self-contained)
        run: >
          dotnet publish src/MultiServerView.App -c Release -r win-x64 --self-contained true
          -p:PublishReadyToRun=false -o publish

      - name: WebView2-Runtime sicherstellen
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (Test-Path $key) { "WebView2 vorhanden: " + (Get-ItemProperty $key).pv }
          else {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile wv2.exe
            Start-Process .\wv2.exe -ArgumentList '/silent','/install' -Wait
          }

      # Ein echter SSH-Server auf dem Runner, damit Terminal, SFTP, Jump Host und Port Forwarding wirklich getestet werden.
      - name: OpenSSH-Server für den Selbsttest einrichten
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            $cap = Get-WindowsCapability -Online -Name 'OpenSSH.Server*' | Select-Object -First 1
            if ($cap.State -ne 'Installed') { Add-WindowsCapability -Online -Name $cap.Name | Out-Null }
            $pw = 'Smoke-Test-Pw-123!'
            New-LocalUser -Name msvtest -Password (ConvertTo-SecureString $pw -AsPlainText -Force) -PasswordNeverExpires | Out-Null
            # Ohne Gruppenmitgliedschaft fehlt dem Konto das Recht zur Netzwerk-Anmeldung (SSH)
            Add-LocalGroupMember -Group 'Users' -Member msvtest
            Start-Service sshd
            # Das Runner-Image beschränkt SSH per AllowGroups - die Gruppe des Testbenutzers dazunehmen
            $cfg = 'C:\ProgramData\ssh\sshd_config'
            $lines = Get-Content $cfg
            ($lines | Where-Object { $_ -match '^\s*(AllowGroups|AllowUsers|DenyGroups|DenyUsers|PasswordAuthentication)' }) | ForEach-Object { "sshd_config: $_" }
            $lines = $lines | ForEach-Object { if ($_ -match '^\s*AllowGroups') { $_ + ' users' } else { $_ } }
            Set-Content $cfg $lines
            Restart-Service sshd
            "sshd: " + (Get-Service sshd).Status
            "MSV_SMOKE_SSH=127.0.0.1:22:msvtest:$pw" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          } catch { "OpenSSH-Server nicht verfügbar: $_" }

      # Startet die fertige App wirklich (Fenster, WebView2, Vault, DPAPI, RDP-Control), bedient die Oberfläche
      # per Skript und legt Screenshots + Bericht ab.
      - name: Selbsttest der App auf Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          $out = (Resolve-Path smoke).Path
          $p = Start-Process -FilePath .\publish\MultiServerView.exe -ArgumentList '--smoke', $out -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Add-Content "$out\report.txt" "FEHL Zeitüberschreitung (App hat sich nicht beendet)"; Get-Content "$out\report.txt"; exit 1 }
          if (Test-Path "$out\report.txt") { Get-Content "$out\report.txt" } else { "Kein Bericht erzeugt" }
          if (Test-Path "$out\exit.log") { "--- Beenden ---"; Get-Content "$out\exit.log" }
          exit $p.ExitCode

      # Die Screenshots zusätzlich als Text ins Log schreiben (für die Auswertung ohne Artefakt-Download)
      - name: Screenshots als Text ausgeben
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem smoke\*.png -ErrorAction SilentlyContinue | ForEach-Object {
            "===PNG:$($_.Name)==="
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            for ($i = 0; $i -lt $b64.Length; $i += 3000) { "PNGDATA " + $b64.Substring($i, [Math]::Min(3000, $b64.Length - $i)) }
            "===ENDPNG==="
          }

      - name: Diagnose OpenSSH (nur bei Fehler)
        if: failure()
        shell: pwsh
        continue-on-error: true
        run: |
          Get-WinEvent -LogName 'OpenSSH/Operational' -MaxEvents 20 -ErrorAction SilentlyContinue | ForEach-Object { "$($_.TimeCreated) $($_.Message)" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Selbsttest-Screenshots
          path: |
            smoke/*.png
            smoke/report.txt
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MultiServerView-win-x64
          path: publish
          if-no-files-found: error
