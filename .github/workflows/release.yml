name: Release

# Builds the installer (Inno Setup wizard) and a portable ZIP and attaches both to a GitHub Release.
# Trigger: push a version tag, e.g.  git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          "v=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Tests (Core)
        run: dotnet test tests/MultiServerView.Core.Tests -c Release

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Publish app (win-x64, self-contained)
        run: >
          dotnet publish src/MultiServerView.App -c Release -r win-x64 --self-contained true
          -p:PublishReadyToRun=false -p:Version=${{ steps.ver.outputs.v }} -o publish

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish\* -DestinationPath "dist\MultiServerView-$v-portable-win-x64.zip"

      - name: Build installer
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DSourceDir=..\publish" installer\MultiServerView.iss

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' dist\* --title '${{ github.ref_name }}' --generate-notes --notes 'Windows SmartScreen may warn on first start because the files are not code-signed yet (More info, then Run anyway). The installer needs no admin rights; the ZIP is portable.'
