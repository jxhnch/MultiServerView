name: Release

# Builds Windows (installer + portable ZIP) and Linux (.deb, AppImage, .tar.gz) in parallel and creates ONE GitHub
# Release with all files, but only if both builds succeeded.
# Trigger: push a version tag, e.g.  git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          "v=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Tests (Core)
        run: dotnet test tests/MultiServerView.Core.Tests -c Release

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Publish app (win-x64, self-contained)
        run: >
          dotnet publish src/MultiServerView.App -c Release -r win-x64 --self-contained true
          -p:PublishReadyToRun=false -p:Version=${{ steps.ver.outputs.v }} -o publish

      # The command line tool "msv" goes into the same folder (it shares the runtime), so the installer and the ZIP contain it.
      - name: Publish msv (command line tool, win-x64)
        run: >
          dotnet publish src/MultiServerView.Cli -c Release -r win-x64 --self-contained true
          -p:PublishReadyToRun=false -p:Version=${{ steps.ver.outputs.v }} -o publish

      # Start the finished app once on the real runner (window, vault, DPAPI, MCP); a failure stops the release.
      - name: App self-test on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          $out = (Resolve-Path smoke).Path
          $p = Start-Process -FilePath .\publish\MultiServerView.exe -ArgumentList '--smoke', $out -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(240000)) { $p.Kill(); if (Test-Path "$out\report.txt") { Get-Content "$out\report.txt" }; exit 1 }
          if (Test-Path "$out\report.txt") { Get-Content "$out\report.txt" }
          exit $p.ExitCode

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.v }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish\* -DestinationPath "dist\MultiServerView-$v-portable-win-x64.zip"

      - name: Build installer
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.v }}'
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DSourceDir=..\publish" installer\MultiServerView.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-files
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Version from tag
        id: ver
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Tests (Core, on Linux)
        run: dotnet test tests/MultiServerView.Core.Tests -c Release

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Publish app (linux-x64, self-contained)
        run: dotnet publish src/MultiServerView.Linux -c Release -r linux-x64 --self-contained true -p:Version=${{ steps.ver.outputs.v }} -o out/msv

      - name: Publish msv (command line tool, linux-x64)
        run: dotnet publish src/MultiServerView.Cli -c Release -r linux-x64 --self-contained true -p:Version=${{ steps.ver.outputs.v }} -o out/msv

      - name: Self-test (no window)
        run: |
          ./out/msv/multiserverview --selftest "$RUNNER_TEMP/selftest"
          ./out/msv/msv --version

      - name: Tools for Linux packages
        run: sudo apt-get install -y desktop-file-utils rpm

      - name: Build .deb, .rpm, AppImage and .tar.gz
        run: bash packaging/linux/build-packages.sh out/msv "${{ steps.ver.outputs.v }}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-files
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  release:
    # Only runs when both builds succeeded, so a release is never half finished.
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist
          gh release create '${{ github.ref_name }}' dist/* --title '${{ github.ref_name }}' --generate-notes \
            --notes 'Windows: the installer needs no admin rights, the ZIP is portable. SmartScreen may warn on first start because the files are not code-signed yet (More info, then Run anyway). Linux: .deb (Debian/Ubuntu), .rpm (Fedora/RHEL), .AppImage or .tar.gz (plus PKGBUILD for Arch), see the README.'
