name: Check

# Only for pull requests (and manual runs): tests on both systems, plus a build of the Windows and the Linux app.
# No artifacts and no installer. Pushes to main build nothing; releases are built by the Release workflow
# when a version tag is pushed.

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitattributes']
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/MultiServerView.Core.Tests -c Release

  windows-app:
    name: Windows app builds
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI (type check + bundle)
        working-directory: ui
        run: |
          npm ci
          npm run build
      - run: dotnet build src/MultiServerView.App -c Release

  linux-app:
    name: Linux app builds and starts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI (type check + bundle)
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Publish Linux app
        run: dotnet publish src/MultiServerView.Linux -c Release -r linux-x64 --self-contained true -o out/msv
      - name: Publish msv (command line tool)
        run: dotnet publish src/MultiServerView.Cli -c Release -r linux-x64 --self-contained true -o out/msv
      - name: Self-test (no window)
        run: |
          ./out/msv/multiserverview --selftest "$RUNNER_TEMP/selftest"
          ./out/msv/msv --version
